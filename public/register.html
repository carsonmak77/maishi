<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册 - 麦氏乡村</title>
  <link rel="stylesheet" href="css/style.css?v=20260909v1">
  <script>
    (function() {
      var themeColor = localStorage.getItem('themeColor') || 'green';
      var darkMode = localStorage.getItem('darkMode') || 'light';
      var lang = localStorage.getItem('language') || 'zh';
      var root = document.documentElement;
      var colors = {
        green: ['#07C160', '#06ad56', '#e8f8f0'],
        blue: ['#1890ff', '#40a9ff', '#e6f7ff'],
        purple: ['#722ed1', '#9254de', '#f9f0ff'],
        orange: ['#fa8c16', '#ffa940', '#fff7e6'],
        red: ['#f5222d', '#ff4d4f', '#fff1f0'],
        cyan: ['#13c2c2', '#36cfc9', '#e6fffb']
      };
      var c = colors[themeColor] || colors.green;
      root.style.setProperty('--theme-primary', c[0]);
      root.style.setProperty('--theme-primary-hover', c[1]);
      root.style.setProperty('--theme-primary-light', c[2]);
      root.setAttribute('data-theme-color', themeColor);
      if (darkMode === 'dark') root.setAttribute('data-theme', 'dark');
      root.lang = lang === 'zh' ? 'zh-CN' : 'en';
    })();
  </script>
</head>
<body>
  <nav class="navbar">
    <div class="navbar-inner">
      <div class="logo site-logo" onclick="window.location.href='index.html'"><span class="site-logo-text">麦氏乡村</span></div>
      <div class="nav-links">
        <a href="index.html">主页</a>
        <a href="genealogy.html">族谱</a>
        <a href="friends.html">朋友们</a>
        <a href="about.html">关于</a>
      </div>
      <div class="navbar-actions">
        <div class="auth-actions" id="authActions">
          <a class="auth-link" href="login.html">登录</a>
        </div>
      </div>
    </div>
  </nav>

  <main class="container page-container">
    <section class="auth-card">
      <p class="page-kicker">Register</p>
      <h1>注册账号</h1>
      <p class="auth-card-desc">创建一个前台账号，用户名至少 3 个字符，密码至少 6 位。</p>
      <form class="front-auth-form" id="frontRegisterForm">
        <div class="form-group-public">
          <label for="registerUsername">用户名</label>
          <input id="registerUsername" type="text" autocomplete="username" placeholder="请输入用户名" required>
        </div>
        <div class="form-group-public">
          <label for="registerPassword">密码</label>
          <input id="registerPassword" type="password" autocomplete="new-password" placeholder="至少 6 位密码" required>
        </div>
        <button class="btn-primary auth-submit-btn" id="frontRegisterBtn" type="submit">注册</button>
        <p class="front-auth-msg" id="frontRegisterMsg"></p>
      </form>
      <p class="auth-switch-text">已有账号？<a href="login.html">去登录</a></p>
    </section>
  </main>

  <script defer src="js/main.js?v=20260823v6"></script>
</body>
</html>
