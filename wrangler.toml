name = "maishi"
compatibility_date = "2026-08-04"
main = "workers/api.js"

[assets]
directory = "dist"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "maishi-db"
database_id = "4e155fce-b3a8-44a6-99d3-00a2bb8025ed"

[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "maishi-uploads"

[vars]
ADMIN_USERNAME = "admin"
# ADMIN_PASSWORD 与 JWT_SECRET 建议用 wrangler secret 设置，不要提交真实密码。
