name = "maishi"
compatibility_date = "2026-08-04"
main = "workers/api.js"

[assets]
directory = "dist"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "maishi-db"
database_id = "请在 Cloudflare 创建 D1 后替换为真实 database_id"

[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "maishi-uploads"

[vars]
ADMIN_USERNAME = "admin"
# ADMIN_PASSWORD 与 JWT_SECRET 建议用 wrangler secret 设置，不要提交真实密码。
